# TEST FIXTURE ONLY (tests/conftest.py points KAIBA_RISK_PATH here). Fake wallets, round
# bankrolls. The runtime reads config/risk.yaml, which ships as a paper-mode template.
version: v1
global_mode: live
kill_switch: false
entries_paused: false
reduce_only: false
bounds:
  # RAISED 5.0 -> 30.0 on 2026-09-24. OWNER's decision, asked and confirmed with the
  # numbers in front of him: "100 dollars minimum per trade ... preferably more".
  # This is the envelope ceiling every position is clamped to, so the lane band and the
  # per-chain caps could never reach $100 while it stood at 5%: sol equity has fallen to
  # 3.684 SOL on realised losses, and $100 is 23.6% of that.
  # AGAINST THE MEASUREMENT, recorded as such: 175 closed sm-trenches trades show a 25.14%
  # win rate and -12.44% mean per trade, needing ~38.10% wins to break even. Size
  # multiplies that. At 30% a position the 70% total-exposure cap allows ~2 concurrent
  # positions, which is also about what the protection tick can service.
  max_size_pct_bankroll: 30.0
  max_total_exposure_pct: 70.0
  max_daily_loss_pct: 10.0
  max_slippage_bps: 2500
  # OWNER 2026-09-24: "Make sure the agent uses 88% slippage anti mev". Scoped to EXITS.
  # 97 of 104 failed sells in 24h were the venue refusing with GEvmInsufficientSlippage:
  # min_out is derived from our last MARK, and on a token that has fallen since, 75% of a
  # stale mark is still above anything the pool will pay. One position demanded 0.0045 ETH
  # for a token with ZERO trades in 24h and retried 90 times; positions sat 26-41h
  # unsellable, which is what stopped entries. Entries stay at 2500 deliberately: at 8800
  # a BUY would accept 12% of the tokens it expected. --anti-mev is on every swap.
  # EXIT-1 2026-09-24: policy now requires trusted SELL context and token-to-native
  # direction for this ceiling. All 50 quote-provenance tests pass at 8800 unchanged;
  # entry, recipient, floor and withdrawal checks remain enforced. No fill guarantee.
  max_exit_slippage_bps: 8800
  max_lane_mode: live
  allow_self_promotion: true
  max_round_trip_cost_pct: 7.0
