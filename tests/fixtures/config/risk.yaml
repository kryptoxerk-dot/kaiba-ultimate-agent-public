    max_exposure_pct: 90.0
    wallet: 62EbtFbmJATT94Y6Uguf6a1kdaJuZWAu8ycqbg3xKfQg
  robinhood:
    enabled: true
    bankroll_base_units: 400000000000000000
    max_position_base_units: 55555555555555555
    min_position_base_units: 37037037037037037
    gas_reserve_base_units: 10000000000000000
    daily_loss_stop_base_units: 97500000000000000
    max_exposure_pct: 90.0
    wallet: '0x72430877378522d1b759ac721561aa9eb9e25c2b'
  bsc:
    enabled: true
    bankroll_base_units: 1000000000000000000
    max_position_base_units: 194130000000000000
    min_position_base_units: 129420000000000000
    gas_reserve_base_units: 30000000000000000
    daily_loss_stop_base_units: 249997000000000000
    max_exposure_pct: 90.0
    wallet: '0x72430877378522d1b759ac721561aa9eb9e25c2b'
  base:
