lanes:
  manual:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    - robinhood
    - bsc
    - base
    - eth
    params:
      require_thesis: true
  confluence-5:
    mode: shadow
    size_pct_min: 1.0
    size_pct_max: 5.0
    chains:
    - sol
    - robinhood
    - bsc
    - base
    params:
      min_entities: 5
      window_s: 120
      min_buy_usd: 50
      max_signal_age_s: 30
      require_wallet_grade: B
  trusted-copy:
    mode: shadow
    size_pct_min: 1.0
    size_pct_max: 5.0
    chains:
    - sol
    - robinhood
    params:
      max_copy_delay_s: 20
      max_price_drift_pct: 12
      follow_exits: true
  curve-velocity:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    params:
      min_progress_pct: 30
      max_progress_pct: 70
      min_sol_per_min: 3.0
      min_sol_per_swap: 0.18
      min_swap_fraction_of_graduation: 0.0021
      max_bundler_pct: 20
      min_graded_wallets: 1
  sm-trenches:
    mode: live
    size_pct_min: 19.3
    size_pct_max: 29.0
    chains:
    - sol
    - bsc
    - robinhood
    params:
      min_smart_degen: 3
      # The lane loads 1800 s of buys (`scanner.recent_buys_window_s`) and used to
      # throw 25 minutes of it away: `window_s` defaulted to 300 s. MEASURED
      # 2026-09-24: at 300 s there were ZERO sol tokens with >=3 tagged smart buyers,
      # 13 at 1800 s. Over six hours 221 tokens across the three chains reached the
      # bar and the lane made 26 decisions. This is the same sampler failure recorded
      # in AGENTS.md, fixed then for token AGE and still open for the confluence
      # WINDOW. Costs no extra provider call: the data is already loaded.
      window_s: 1800
      min_independent_entities: 2
      max_rug_ratio: 0.3
      min_holder_count: 0
      blocked_launchpads: []
  migration-fade:
    mode: shadow
    size_pct_min: 1.0
    size_pct_max: 5.0
    chains:
    - sol
    params:
      sell_within_s: 180
      max_hold_s: 1200
      never_hold_through_migration: true
  kol-fade:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    - robinhood
    params:
      min_caller_trades: 10
      min_caller_expectancy: 0.0
  listing-pop:
    mode: 'off'
    size_pct_min: 0.5
    size_pct_max: 2.0
    chains:
    - sol
    params:
      max_latency_s: 30
  pons-robinhood:
    mode: shadow
    size_pct_min: 0.5
    size_pct_max: 2.0
    chains:
    - robinhood
    params:
      min_entities: 3
      max_age_s: 1800
      min_liquidity_usd: 5000
