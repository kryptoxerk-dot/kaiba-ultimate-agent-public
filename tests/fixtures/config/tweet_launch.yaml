# TEST FIXTURE ONLY: the armed shape of config/tweet_launch.yaml, for tests that exercise the
# live path. The runtime reads config/tweet_launch.yaml, which ships as a shadow template.
# Tweet launcher — kaiba/execution/tweet_launch.py
# Codex integration 2026-10-07: select the funded custom-rule socket; this does not
# activate provider rules. Every entry brake applies before a create EXCEPT the flat
# per-trade size cap (the owner's 5% dev buy is above it): tweet_launch._admission.
#
# When a watched X account posts, decide whether the post is launchable, derive a name and
# ticker from it, and launch the token through GMGN `cooking create` from the agent wallet
# (the wallet bound to GMGN_API_KEY, i.e. the chain wallet in config/risk.yaml), with a dev
# buy in the creation transaction.
#
# mode: shadow  -> decide and RECORD only (tweet_launches table). Nothing is sent.
# mode: live    -> also send. Requires ALL of: this file's mode = live, `armed_by` filled in,
#                  the `tweet-launch` Lane wired in kaiba/core/schemas.py, and the chain's
#                  launchpad entry having live: true. The owner arms it, in writing.
mode: live
armed_by: "the operator 2026-10-06 chat: Just make auto launcher based on tweets works"

feed:
  backend: twitterapi_rule  # j7 and twitterapi_monitor are also supported
  region: dfw              # applies only to the authenticated J7 source

# Dev buy target, as a share of total supply bought inside the creation transaction.
# Owner ask 2026-10-06: 5%. Modelled cost incl. fee: pump ~1.485 SOL, Flap (BNB curve,
# measured on chain) ~0.2933 BNB, Pons V2 ~0.0893 ETH (see dev_buy_native). Only launchpads with a curve model can be sized by supply share; the rest
# need an explicit buy_amt_native below and record supply_pct = NULL.
dev_buy_supply_pct: 5.0

# Per chain: which launchpad, the cap on any single dev buy, and whether live may send.
chains:
  sol:
    dex: pump
    max_buy_native: 1.5
    holder_fees: cashback   # creator fee -> traders. UNVERIFIED since pump.fun's 2026-09-12 switch to Holder Rewards
    live: true
  bsc:
    dex: flap
    max_buy_native: 0.5
    holder_fees: { dividend_tax_bps: 100 }   # 1% buy/sell tax, 100% of it paid to holders as dividends
    live: true
  robinhood:
    dex: pons
    max_buy_native: 0.1
    # The 99% second-0 snipe tax does NOT apply to the deployer's own buy inside the launch tx
    # (MEASURED: currentSnipeTaxBps(deployer) = 0; 1,106 of 1,120 second-0 buys paid 0 --
    # docs/research/line4-antisniper-tax-pons.md:116-146; owner confirmed 2026-10-07). The
    # post-launch receipt check switches robinhood off if a dev buy is ever taxed anyway.
    # No holder-fee mechanism on Pons via GMGN (no creator-tax flag): fees stay protocol-only.
    live: true

# Spend and rate bounds (live only; shadow records everything).
daily_launch_cap: 10        # the SOL/BNB/ETH daily caps bind first (~4 sol, ~3 bsc, ~3 rh)
daily_native_cap: { sol: 6.0, bsc: 1.0, robinhood: 0.3 }
per_author_cooldown_s: 900       # at most one launch per account per 15 minutes
max_tweet_age_s: 20              # a post older than this when it reaches us is too late to be first
slippage_pct: 30

# Post selection. A post must score >= min_score to launch.
min_score: 1.5                  # a fresh post with an image qualifies on its own (owner: see launches)
post_kinds: [post, quote]        # replies and reposts are skipped unless an account overrides it
require_image: true              # a launch needs a logo: the post's image, else a generated one
link_tweet_as_twitter: true      # --twitter <the post URL>: credit the source, never claim affiliation

# Market observation on the same post (shadow AND live): count other launches whose
# symbol/name matches our ticker at these horizons after the post.
observe_horizons_s: [120, 600, 1800]

