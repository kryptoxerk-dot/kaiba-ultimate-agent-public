# The model reads each post and picks whether to launch, the name and the ticker
# (kaiba/execution/tweet_creative.py). On any failure / timeout the deterministic word
# picker is used.
namer:
  enabled: true
  # Tried in order; first answer wins, then the deterministic picker.
  # hermes: one-shot through the Hermes profile's own login, with NO tools (--safe-mode,
  #   -t context_engine) because the post is untrusted text. Needs that profile logged in.
  # anthropic: direct API with ANTHROPIC_API_KEY.
  backends: [hermes, anthropic]
  hermes_profile: kaiba-operator
  model: claude-opus-5-5
  timeout_s: 8

# Logo when the post has no image: OpenAI Images if OPENAI_API_KEY is set, else Pollinations
# (free, rate-limited). Never the author's profile picture.
logo:
  generate: true
  timeout_s: 15

# How often the curves of our open launches are read for the "no volume" exit.
# The exit rules themselves (sell in increments; sell all after 60 s with no trade) are the
# ladder's: config/risk.yaml protection.lanes.tweet-launch.
activity_poll_s: 3

# Early alpha (owner 2026-10-07: "get early alpha from there"): posts from these accounts that
# name a token (contract address or $TICKER) are recorded with the token's price at our first
# look and at each horizon after it (kaiba/execution/tweet_refs.py, table tweet_refs).
# RECORD ONLY (mode: shadow) until the forward returns say buying on these posts pays.
# Sources: docs/research/codex-j7tracker-watchlist-20261006.csv (callers + launchpad accounts).
alpha:
  mode: shadow
  horizons_s: [60, 300, 900, 3600]
  max_refs_per_post: 3
  accounts:
    - { handle: blknoiz06,       chains: [sol] }
    - { handle: frankdegods,     chains: [sol] }
    - { handle: crashiusclay69,  chains: [sol] }
    - { handle: MustStopMurad,   chains: [sol] }
    - { handle: pumpfun,         chains: [sol] }
    - { handle: bagsapp,         chains: [sol] }
    - { handle: theunipcs,       chains: [bsc] }
    - { handle: flapdotsh,       chains: [bsc, robinhood] }
    - { handle: four_meme_fora,  chains: [bsc] }
    - { handle: ponsdotfamily,   chains: [robinhood] }
    - { handle: lookonchain,     chains: [sol, bsc] }
    - { handle: cz_binance,      chains: [bsc] }
    - { handle: elonmusk,        chains: [sol] }

# Vamp (owner 2026-10-07: "the agent can vamp launches out of tweets"): clone a token a
# watched post names (its name, ticker, logo, X link) into our own launch on another chain.
# PLANNED AND RECORDED ONLY (tweet_refs.vamp_json holds the exact gmgn argv). Measured prior:
# copycats graduate 0.86% vs 9.20% for originals (arXiv 2609.10246); every later-than-first
# launch on a tweet was negative in our census. Same-chain vamps are off for that reason.
vamp:
  # Owner 2026-10-07: "Vamp launches with volume / Just use same everything".
  # tweet_launches: when OTHERS launch from a watched launch-account post and the token shows
  # provider-reported 5-minute volume, clone its name/ticker/logo into our own launch through the
  # normal send path (same 5% buy, holder fees, ladder, daily caps, one launch per post+chain).
  tweet_launches: live
  window_s: 60
  min_volume_usd: 0
  # tweet_refs (alpha-account token mentions): clone plans are RECORDED only.
  mode: shadow
  targets: [bsc, robinhood, sol]
  same_chain: true
