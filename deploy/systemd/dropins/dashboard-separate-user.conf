# Drop-in: run the dashboard under its own identity.
#
# Use this when the console is reachable from anything wider than loopback or a
# Tailscale interface. It moves the web process off kaiba-core, so a bug in a template,
# an SSE handler or a form parser cannot be leveraged into the identity that runs
# ingestion and the protection watchdog.
#
# Prerequisite: sudo deploy/bootstrap.sh --separate-dash
#   (that is what puts kaiba-dash in the kaiba-state group, which is what lets it open
#    the database and risk.yaml; without it the dashboard starts and shows empty panels)
#
# Install:
#   sudo mkdir -p /etc/systemd/system/kaiba-dashboard.service.d
#   sudo cp deploy/systemd/dropins/dashboard-separate-user.conf \
#           /etc/systemd/system/kaiba-dashboard.service.d/20-separate-user.conf
#   sudo systemctl daemon-reload && sudo systemctl restart kaiba-dashboard

[Service]
User=kaiba-dash
Group=kaiba-dash
SupplementaryGroups=
SupplementaryGroups=kaiba kaiba-state kaiba-reports
Environment=HOME=/var/lib/kaiba/dash
