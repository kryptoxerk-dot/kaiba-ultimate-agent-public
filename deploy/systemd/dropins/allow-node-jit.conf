# Drop-in: relax MemoryDenyWriteExecute for one unit.
#
# Why this exists: gmgn-cli is a node program, and V8 allocates write-then-execute pages
# for its JIT. With MemoryDenyWriteExecute=yes the node process dies immediately with a
# mmap/mprotect failure, which looks like "gmgn-cli exited 133 with no output" and wastes
# an afternoon.
#
# Apply it ONLY to the unit that actually spawns node, never globally:
#
#   sudo mkdir -p /etc/systemd/system/kaiba-engine.service.d
#   sudo cp deploy/systemd/dropins/allow-node-jit.conf \
#           /etc/systemd/system/kaiba-engine.service.d/20-allow-node-jit.conf
#   sudo systemctl daemon-reload && sudo systemctl restart kaiba-engine
#
# deploy/install.sh does this for you when KAIBA_ALLOW_NODE_JIT lists the unit names.
#
# The alternative, if you would rather keep W^X: run gmgn-cli out of process behind a
# tiny helper unit of its own that has this relaxation and nothing else. That is the
# better long-term shape; this drop-in is the pragmatic one.
#
# Record every use of this file in docs/worklogs/ — it is a deliberate reduction in
# hardening on a machine that holds money.

[Service]
MemoryDenyWriteExecute=no
