# Kaiba signer policy — the withdrawal gate.
#
# THIS FILE IS OPERATOR-OWNED AND LOADED READ-ONLY. On the VPS it lives under root and is
# readable, not writable, by `kaiba-agent` and `kaiba-core` (deploy/ enforces that). Hermes
# may read it to explain a refusal; it may not edit it.
#
# What this file can do: NARROW what the signer will sign. It selects a subset of the
# programs, tip accounts and function selectors that `kaiba/execution/policy.py` knows how
# to decode, and it declares which addresses are ours.
#
# What this file cannot do: WIDEN anything.
#   * `solana.allowed_programs` is intersected with the code-level program registry. A
#     program the decoder does not understand can never be allowlisted here, because a
#     program we cannot decode is a program whose transfers we cannot see.
#   * `solana.jito_tip_accounts` is intersected with the eight canonical Jito tip accounts
#     that are compiled into the module. Adding an address here does nothing.
#   * `solana.max_tip_lamports` and `solana.max_compute_unit_price_micro_lamports` are
#     capped by absolute ceilings in code.
#   * `evm.allowed_selectors` is intersected with the known-function table, minus the
#     hard-denied set (transfer, transferFrom, bridge deposits, approvals-for-all, ...).
#     Listing `transfer` here does nothing.
#   * There is no key that enables a withdrawal. There is no code path that signs one.
#
# The two entries that DO grant trust are `owned_addresses` and `evm.routers`: declaring an
# address here says "this is ours" / "this is a DEX router". That is the operator's call and
# nothing else in the system may write them. Even then the hard-denied operations stay
# denied — an ERC-20 `transfer` is refused no matter whose address the recipient is.
#
# VERIFY BEFORE ARMING: every program id and router address below must be checked against a
# block explorer. They are transcribed from research, not fetched.

version: v1

# Our own wallets and, on Solana, their associated token accounts. Base58 is
# case-sensitive; EVM entries are compared case-insensitively. Empty = nothing is ours yet,
# which means every transfer is refused. That is the correct state before funding.
owned_addresses:
  # Declared by the operator 2026-09-21 to arm live trading. This is the signer's
  # definition of "ours": value may settle HERE and nowhere else. Adding an address is
  # the one thing in this file that grants trust, and no code may write it.
  sol: []   # add YOUR wallet address here before arming
  # Declared by the operator 2026-09-21 ("Go on robinhood and bnb chain as well").
  # ONE EVM key covers both chains -- `gmgn-cli portfolio info` reports the same address
  # bound on bsc and robinhood, so this is a single custodial wallet reachable on two
  # networks, not two wallets. Read from the provider, not transcribed from a note.
  #
  # Declaring it says "value may settle HERE". It does NOT widen anything else: an
  # ERC-20 `transfer`/`transferFrom` stays hard-denied no matter whose address receives
  # it, which is re-proved in tests/test_policy.py after every change to this file.
  robinhood: []   # add YOUR wallet address here before arming
  bsc: []   # add YOUR wallet address here before arming
  base: []

