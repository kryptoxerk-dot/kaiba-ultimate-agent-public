  max_tip_lamports: 10000000                     # 0.01 SOL; code ceiling 0.1 SOL
  max_compute_unit_price_micro_lamports: 5000000 # priority fee is a value leak, so it is capped

evm:
  # DEX routers per chain. `to` must be one of these (the one exception is `approve`, which
  # is sent to the token contract and is checked on its spender instead).
  routers:
    # Robinhood Chain 4663. Identified by Claude on 2026-09-20 directly from the chain,
    # because no published source lists it. This matters: Pons on Robinhood Chain is now
    # the world's largest launchpad by fees ($131M/30d, 2.8x pump.fun), and an empty list
    # here refused every transaction on that chain by construction.
    #
    # Evidence, reproducible against https://rpc.mainnet.chain.robinhood.com (chain id
    # 0x1237 = 4663):
    #   * sampled 12 recent blocks; this address was called with 0x3593564c and
    #     0x24856bc3, the two Uniswap Universal Router `execute` selectors
    #   * eth_getCode returns 24,546 bytes, consistent with a Universal Router
    #   * two successful transactions to it (status 0x1) emit
    #     0x40e9cecb…7112f = Uniswap V4 Swap, plus ERC-20 Transfers
    #   * this matches the documented Pons behaviour of graduating to Uniswap v4
    #
    # Falsifiable: if this address stops emitting V4 Swap events, or a block explorer
    # shows verified source for a different Universal Router, replace it. Confirm on an
    # explorer before moving size; the lane is in shadow until you do.
    robinhood:
      # VERIFIED on chain 2026-09-21: 24,546 bytes, carries both UniversalRouter execute
      # selectors (0x3593564c, 0x24856bc3). It is a real UniversalRouter.
      #
      # OPEN QUESTION, and do not resolve it by guessing. There are at least THREE
      # UniversalRouters on chain 4663, all verified live on the same day:
      #     0x8876789976decbfcbbbe364623c63652db8c0904  24,546b  <- this one
      #     0x06afba43fd06227fa663b0daecf536f6eaa6bf99  24,546b
      #     0x204faca1764b154221e35c0d20abb3c525710498  24,380b  (a different build)
      # Uniswap's own v3 and v4 doc pages contradict each other about which is current,
      # and a 400-swap sample found the docs-recommended one taking ZERO flow. One older
      # build ships a placeholder Across SpokePool, so Across commands silently fail.
      #
      # We cannot settle it from our own data: all 390,795 Robinhood swaps we have
      # ingested went through `pons-curve`, so we have never observed post-graduation
      # router flow. Before arming this chain, determine the live router empirically
      # from real swaps -- a matching byte size is not identity. Robinhood is not a
      # trading target today (docs/TRADING-METHOD.md: both latency edges are closed by
      # contract design) and owned_addresses.robinhood is empty, so nothing can settle
      # there regardless.
      - "0x8876789976decbfcbbbe364623c63652db8c0904"  # Uniswap UniversalRouter (Robinhood 4663)
    bsc:
      - "0x10ed43c718714eb63d5aa57b78b54704e256024e"  # PancakeSwap V2 router
      - "0x13f4ea83d0bd40e75c8222255bc855a974568dd4"  # PancakeSwap Smart Router v3
      - "0xb971ef87ede563556b2ed4b1c0b0019111dd85d2"  # Uniswap SwapRouter02 (BSC)
      - "0x1a0a18ac4becddbd6389559687d1a73d8927e416"  # Uniswap UniversalRouter (BSC)
      - "0x000000000022d473030f116ddee9f6b43ac78ba3"  # Permit2
    base:
      - "0x2626664c2603336e57b271c5c0b26f421741e481"  # Uniswap SwapRouter02 (Base)
      - "0x4752ba5dbc23f44d87826276bf6fd6b1c372ad24"  # Uniswap V2 router (Base)
      - "0x6ff5693b99212da76ad316178a184ab56d299b43"  # Uniswap UniversalRouter (Base)
      - "0x000000000022d473030f116ddee9f6b43ac78ba3"  # Permit2

  # Function names from the known-function table in policy.py. A name that is not in that
  # table, or that is in the hard-denied set, is ignored — listing it grants nothing.
  allowed_selectors:
    - exactInputSingle
    - exactInputSingleWithDeadline
    - exactInput
    - swapExactETHForTokens
    - swapExactETHForTokensSupportingFeeOnTransferTokens
    - swapExactTokensForETH
    - swapExactTokensForETHSupportingFeeOnTransferTokens
    - swapExactTokensForTokens
    - swapExactTokensForTokensSupportingFeeOnTransferTokens
    - unwrapWETH9
    - approve
    - execute

  # `approve` to an allowlisted spender above this value is still signed, but it is flagged.
  # null keeps the Permit2 / infinite-approval pattern working.
  max_approval_wei: null
