# TEMPLATE. Ships in paper mode: global_mode shadow, every lane shadow, every chain disabled,
# bankroll 0, no wallets. To trade, set your own wallet + bankroll per chain, enable the chain,
# and move ONE lane to live only after you have measured it in shadow. Values are base units
# (lamports for sol, wei for EVM chains).
version: v1
global_mode: shadow
kill_switch: false
entries_paused: true
reduce_only: false
bounds:
  max_size_pct_bankroll: 30.0
  max_total_exposure_pct: 70.0
  max_daily_loss_pct: 10.0
  max_slippage_bps: 2500
  max_exit_slippage_bps: 8800
  max_lane_mode: shadow
  allow_self_promotion: true
  max_round_trip_cost_pct: 7.0
chains:
  sol:
    enabled: false
    bankroll_base_units: 0
    max_position_base_units: 830000000
    min_position_base_units: 370000000
    gas_reserve_base_units: 50000000
    daily_loss_stop_base_units: 0
    max_exposure_pct: 90.0
    wallet: ''
  robinhood:
    enabled: false
    bankroll_base_units: 0
    max_position_base_units: 37037037037037037
    min_position_base_units: 16700000000000000
    gas_reserve_base_units: 10000000000000000
    daily_loss_stop_base_units: 0
    max_exposure_pct: 90.0
    wallet: ''
  bsc:
    enabled: false
    bankroll_base_units: 0
    max_position_base_units: 155773349776075800
    min_position_base_units: 129420000000000000
    gas_reserve_base_units: 30000000000000000
    daily_loss_stop_base_units: 0
    max_exposure_pct: 90.0
    wallet: ''
  base:
    enabled: false
    bankroll_base_units: 0
    max_position_base_units: 500000000000000
    min_position_base_units: 100000000000000
    gas_reserve_base_units: 2000000000000000
    daily_loss_stop_base_units: 0
    max_exposure_pct: 90.0
lanes:
  manual:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    - robinhood
    - bsc
    - base
    - eth
    params:
      require_thesis: true
  confluence-5:
    # 2026-10-03: re-pointed at PROVEN wallets (kaiba.learning.proven; daily job proven_wallets).
    # First freeze: robinhood 5 wallets (4 entities) with out-of-sample copy returns > 0 at
    # our lag + fees; sol none. SHADOW (paper) only; flat size at the chain floor; the
    # confluence level is recorded per signal for kaiba.learning.confluence_size.
    mode: shadow
    size_pct_min: 26.0
    size_pct_max: 29.0
    chains:
    - sol
    - robinhood
    params:
      wallet_source: proven
      proven_max_cohort_age_s: 259200
      proven_strength: 0.75
      min_entities: 2
      window_s: 1800
      min_buy_usd: 20
      max_signal_age_s:
        sol: 180
        robinhood: 60
        default: 120
      require_wallet_grade: B
  trusted-copy:
    mode: shadow
    size_pct_min: 1.0
    size_pct_max: 5.0
    chains:
    - sol
    - robinhood
    params:
      max_copy_delay_s: 20
      max_price_drift_pct: 12
      follow_exits: true
  curve-velocity:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    params:
      min_progress_pct: 30
      max_progress_pct: 70
      min_sol_per_min: 3.0
      min_sol_per_swap: 0.18
      min_swap_fraction_of_graduation: 0.0021
      max_bundler_pct: 20
      min_graded_wallets: 1
  sm-trenches:
    mode: shadow
    size_pct_min: 26.0
    size_pct_max: 29.0
    chains:
    - sol
    - bsc
    - robinhood
    params:
      # PRODUCTION ONLY (box config/risk.yaml): max_market_cap_usd: 3000000 -- owner 2026-10-03,
      # every chain, unknown cap -> refused. Not set in this file: ~20 lane tests build
      # sm-trenches signals without a market cap and read this file (the public export's
      # fixture config is generated from it), and test_entry_features asserts the shipped
      # defaults set no feature thresholds. Survives save_risk on the box (verified).
      min_smart_degen: 3
      window_s: 1800
      min_independent_entities: 2
      max_rug_ratio: 0.3
      min_holder_count: 0
      blocked_launchpads: []
      live_launchpads_by_chain:
        robinhood:
        - pons
        - pons_v2
  migration-fade:
    mode: shadow
    size_pct_min: 1.0
    size_pct_max: 5.0
    chains:
    - sol
    params:
      sell_within_s: 180
      max_hold_s: 1200
      never_hold_through_migration: true
  kol-fade:
    mode: shadow
    size_pct_min: 0.25
    size_pct_max: 1.0
    chains:
    - sol
    - robinhood
    params:
      min_caller_trades: 10
      min_caller_expectancy: 0.0
  listing-pop:
    mode: 'off'
    size_pct_min: 0.5
    size_pct_max: 2.0
    chains:
    - sol
    params:
      max_latency_s: 30
  pons-robinhood:
    mode: shadow
    size_pct_min: 0.5
    size_pct_max: 2.0
    chains:
    - robinhood
    params:
      min_entities: 3
      max_age_s: 1800
      min_liquidity_usd: 5000
  launch-snipe:
    # Launch sniping (kaiba/execution/snipe.py, unit kaiba-snipe): records signals, the engine
    # decides them under every gate, ops.execute_planned submits. PRODUCTION (box) runs this
    # lane LIVE -- owner, 2026-10-04: "live small". Shipped here as shadow so a fresh
    # deploy from this file never arms it. Size = size_pct_min (bottom rung) of equity.
    mode: shadow
    size_pct_min: 6.0
    size_pct_max: 7.0
    chains:
    - robinhood
    - sol
    params:
      chains: [robinhood, sol]
      venues:
        robinhood: [pons]
        sol: [launchlab, pump.fun]
      dev_watchlist: []
      name_watchlist: []
      fire_on_records: [low/runner, mid/runner]
      never_records: [spam/all_dud]
      max_entry_tax_bps: 0
      exempt_buyer_veto: true
      dev_atomic_veto_wei: 30000000000000000
      max_snipes_per_day:
        robinhood: 5
        sol: 5
      max_dossiers_per_hour: 40
      live_launchpads_by_chain:
        robinhood: [pons]
        sol: [pump.fun]
protection:
  # 2026-10-03: entries reserve open positions' + the new ticket's stop exposure against the
  # remaining daily budget (SOL 10-02 closed at 206% of its stop). 0 = off.
  daily_stop_reserve_pct: 0.40
  # Paper lanes skip live-money brakes; bounded by this many open paper positions per lane.
  shadow_max_open_per_lane: 5
  onchain_price_log: true
  onchain_price_log_min_interval_s: 10
  onchain_price_log_retention_days: 14
  poll_interval_s: 12
  price_source: venue
  use_provider_orders: false
  stop_loss_bps: 3000
  tp_ladder:
  - - 2.0
    - 50
  - - 5.0
    - 25
  - - 10.0
    - 15
  trailing:
  - - 1.2
    - 2000
  - - 2.0
    - 3000
  - - 5.0
    - 2500
  - - 10.0
    - 2000
  - - 25.0
    - 1500
  - - 100.0
    - 1000
  breakeven_after_tp1: true
  anti_wick_min_ratio: 0.7
  rug_liquidity_drop_pct: 40
  emergency_loss_bps: 5000
  stale_no_volume_exit_s: 3600
  moonbag_retain_pct: 20
  max_blind_s: 300
  max_blind_halt_entries: true
provider_budgets:
  robinhood-rpc:
    min_interval_ms: 1500
    capacity: 3
    refill_per_s: 0.6
    max_inflight: 1
  gmgn:
    min_interval_ms: 250
    capacity: 60
    refill_per_s: 3.0
    max_inflight: 4
    weights:
      quote: 10
      swap: 10
      default: 1
  raydium_launchpad:
    min_interval_ms: 350
    capacity: 5
    refill_per_s: 2.0
    max_inflight: 1
  helius:
    min_interval_ms: 100
    capacity: 50
    refill_per_s: 10.0
    max_inflight: 4
    daily_credit_cap: 900000
  dexscreener:
    min_interval_ms: 1100
    capacity: 60
    refill_per_s: 1.0
    max_inflight: 2
  solanatracker:
    min_interval_ms: 350
    capacity: 3
    refill_per_s: 3.0
    max_inflight: 2
  rugcheck:
    min_interval_ms: 500
    capacity: 10
    refill_per_s: 2.0
    max_inflight: 2
  goplus:
    min_interval_ms: 500
    capacity: 30
    refill_per_s: 2.0
    max_inflight: 2
  jupiter:
    min_interval_ms: 1100
    capacity: 5
    refill_per_s: 1.0
    max_inflight: 2
